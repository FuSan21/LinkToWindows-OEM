name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases on tags

jobs:
  module:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Dhaka
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version = git describe, versionCode = commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Version
        run: |
          echo "LTW_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          echo "LTW_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.LTW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ltw.jks"
            echo "LTW_KEYSTORE=$RUNNER_TEMP/ltw.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::LTW_KEYSTORE_B64 not set - APKs are debug-signed and will not update over other builds"
          fi

      - name: Build APKs + device-private jar
        env:
          LTW_KEYSTORE_PASSWORD: ${{ secrets.LTW_KEYSTORE_PASSWORD }}
          LTW_KEY_ALIAS: ${{ secrets.LTW_KEY_ALIAS }}
          LTW_KEY_PASSWORD: ${{ secrets.LTW_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :device-private:deviceprivateJar :broker:assembleRelease :ltwemu:assembleRelease

      - name: Build virtual keyboard (NDK)
        run: bash module/virtual_keyboard/build.sh

      - name: Assemble module zip (no Microsoft APKs)
        run: |
          bash module/build-module.sh
          mkdir -p dist
          cp module/build/ltw_oem_module-*.zip dist/
          cp module/ltwemu/build/outputs/apk/release/*.apk "dist/LtwEmu-$LTW_VERSION.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ltw-oem-${{ env.LTW_VERSION }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
