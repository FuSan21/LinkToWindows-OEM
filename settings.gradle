pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'LinkToWindows-OEM'

// Rooted-stock module path. Shares its Java/AIDL/C++ sources with the ROM path in rom/.
include ':stubs', ':device-private', ':broker', ':ltwemu'
project(':stubs').projectDir = file('module/stubs')
project(':device-private').projectDir = file('module/device-private')
project(':broker').projectDir = file('module/broker')
project(':ltwemu').projectDir = file('module/ltwemu')
