// Rooted-stock build of the ROM broker (rom/broker): same Java + AIDL; the manifest differs only by
// defining MANAGE_CROSS_DEVICE (see manifest). Shared settings: root build.gradle.
plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.microsoftsdk.crossdeviceservicebroker'
    defaultConfig {
        applicationId = 'com.microsoftsdk.crossdeviceservicebroker'
    }
    sourceSets {
        main {
            java.srcDirs = ["${rootDir}/rom/broker/src"]
            aidl.srcDirs = ["${rootDir}/rom/broker/aidl"]
        }
    }
}

apply from: "${rootDir}/module/signing.gradle"
