// Builds com.microsoft.device-private.jar (shared library, dex jar) from the SAME sources the
// Lineage build uses: rom/device-private/java + rom/aidl.
plugins {
    id 'com.android.application'
}

android {
    namespace = 'me.ayra.ltw.devicepriv'
    defaultConfig {
        applicationId = 'me.ayra.ltw.devicepriv.buildonly'
        versionCode = 1
        versionName = '1.0'
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.debug // build-only APK; only its dex is shipped
        }
    }
    buildFeatures {
        resValues = false
    }
    sourceSets {
        main {
            java.srcDirs = ["${rootDir}/rom/device-private/java"]
            aidl.srcDirs = ["${rootDir}/rom/aidl"]
        }
    }
}

// apk -> jar containing only classes*.dex (resolved at execution time)
tasks.register('deviceprivateJar') {
    dependsOn 'assembleRelease'
    def outDir = layout.buildDirectory.dir('ltw')
    def apkDir = layout.buildDirectory.dir('outputs/apk/release')
    inputs.dir apkDir
    outputs.dir outDir
    doLast {
        def apk = apkDir.get().asFile.listFiles().find { it.name.endsWith('.apk') }
        if (apk == null) throw new GradleException('release APK not found')
        def out = outDir.get().file('com.microsoft.device-private.jar').asFile
        out.parentFile.mkdirs()
        ant.zip(destfile: out) {
            zipfileset(src: apk, includes: 'classes*.dex')
        }
        println "device-private jar: ${out}"
    }
}
