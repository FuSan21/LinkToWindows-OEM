// LSPosed/Vector module (modern libxposed API 102): the rom/patches/frameworks_base call sites as
// hooks, calling the same classes as the ROM build (rom/services/java). Shared settings: root
// build.gradle.
plugins {
    id 'com.android.application'
}

android {
    namespace = 'me.ayra.ltw.emu'
    defaultConfig {
        applicationId = 'me.ayra.ltw.emu'
    }
    sourceSets {
        main {
            java.srcDirs += ["${rootDir}/rom/services/java"] // not java-platform/ (ROM only)
            aidl.srcDirs = ["${rootDir}/rom/aidl"]
        }
    }
}

apply from: "${rootDir}/module/signing.gradle"

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
